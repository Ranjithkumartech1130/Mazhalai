<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mazhalai Admin — Redirecting…</title>
  <!-- Redirect immediately to the React admin app -->
  <meta http-equiv="refresh" content="0; url=../admin-app/index.html" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffd400;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.3rem; color: #111; margin-bottom: 8px; }
    p  { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
    a  {
      display: inline-block;
      background: #111;
      color: #ffd400;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting to Admin Panel…</h1>
    <p>
      This page has been replaced by the new Mazhalai Admin (React app).<br>
      You will be redirected automatically.
    </p>
    <a href="../admin-app/index.html">Open Admin Panel →</a>
  </div>
</body>
</html>
